<article
  class="w-full max-w-sm overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
>
  <img
    class="h-56 w-full object-cover"
    [src]="image()"
    [alt]="imageAlt()"
  />
  <div class="p-6">
    <h3 class="text-xl font-semibold text-slate-950">{{ title() }}</h3>
    <p class="mt-2 text-base leading-7 text-slate-600">
      {{ description() }}
    </p>
    <a
      class="mt-5 inline-flex min-h-12 items-center justify-center rounded-lg bg-[var(--color-brand)] px-6 py-3 text-sm font-semibold text-white transition hover:brightness-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-brand)]"
      [href]="href()"
    >
      {{ actionLabel() }}
    </a>
  </div>
</article>
