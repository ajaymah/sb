<header class="border-b border-white/15 bg-[var(--color-brand)]">
  <div class="mx-auto flex max-w-7xl flex-col gap-4 px-5 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-8">
    <a
      routerLink="/home"
      class="flex w-fit items-center gap-3 rounded-lg text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white"
      aria-label="WBG home"
    >
      <span class="grid size-10 place-items-center rounded-xl bg-white text-sm font-bold tracking-wide text-[var(--color-brand)]"> WBG </span>
      <span class="text-xl font-bold tracking-tight">Story Book</span>
    </a>

    <nav aria-label="Main navigation">
      <ul class="flex flex-wrap items-center gap-1">
        <li>
          <a
            routerLink="/home"
            routerLinkActive="bg-white/15 text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            class="inline-flex min-h-11 items-center rounded-lg px-4 text-sm font-medium text-white/85 transition-colors hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
          >
            Home
          </a>
        </li>
        <li>
          <a
            routerLink="/form-elements"
            routerLinkActive="bg-white/15 text-white"
            ariaCurrentWhenActive="page"
            class="inline-flex min-h-11 items-center rounded-lg px-4 text-sm font-medium text-white/85 transition-colors hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
          >
            Form elements
          </a>
        </li>
        <li>
          <a
            routerLink="/tables"
            routerLinkActive="bg-white/15 text-white"
            ariaCurrentWhenActive="page"
            class="inline-flex min-h-11 items-center rounded-lg px-4 text-sm font-medium text-white/85 transition-colors hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
          >
            Tables
          </a>
        </li>
        <li>
          <a
            routerLink="/grid"
            routerLinkActive="bg-white/15 text-white"
            ariaCurrentWhenActive="page"
            class="inline-flex min-h-11 items-center rounded-lg px-4 text-sm font-medium text-white/85 transition-colors hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
          >
            Grid
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
